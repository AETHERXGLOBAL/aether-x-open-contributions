# Temporary, bounded source-qualification workflow for internal evidence PR #14.
# No PR, comment, tag, workflow secret or upstream write permission is granted.
name: Pydantic 14230 pinned-main regression qualification
on:
  pull_request:
    paths:
      - 'tests/pydantic/14230/**'
      - '.github/workflows/pydantic-14230-source-qualification.yml'
permissions:
  contents: read
jobs:
  pinned-main-14230:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    env:
      EXPECTED_UPSTREAM_SHA: dabcc6461dafa4337c52faf3e9941431ea41ce4a
    steps:
      - name: Select declared Python runtime (pinned setup-python v6.0.0)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout company test evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact official Pydantic main commit (public, read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: pydantic/pydantic
          ref: ${{ env.EXPECTED_UPSTREAM_SHA }}
          path: upstream-pydantic
          persist-credentials: false
      - name: Install isolated Python source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .qualification-venv
          .qualification-venv/bin/python -m pip install --disable-pip-version-check --no-input -e ./upstream-pydantic
          .qualification-venv/bin/python -m pip install --disable-pip-version-check --no-input pytest pytest-benchmark 'pytest-run-parallel>=0.3.1' jsonschema dirty-equals pytest-mock pytest-examples faker pytest-pretty packaging time-machine ruff
      - name: Check source identity and run both outcomes
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C upstream-pydantic rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_UPSTREAM_SHA"
          .qualification-venv/bin/python - <<'PY'
          import pathlib
          import pydantic
          source_root = pathlib.Path('upstream-pydantic').resolve()
          imported = pathlib.Path(pydantic.__file__).resolve()
          assert imported.is_relative_to(source_root), f'Not importing upstream source: {imported}'
          print(f'PINNED_SOURCE_IMPORT_OK upstream={source_root} imported={imported} version={pydantic.__version__}')
          PY
          set +e
          .qualification-venv/bin/python tests/pydantic/14230/reproducer.py --expect-bug | tee /tmp/pydantic-14230-bug.json
          bug_rc=${PIPESTATUS[0]}
          .qualification-venv/bin/python tests/pydantic/14230/reproducer.py --require-fix | tee /tmp/pydantic-14230-fixed.json
          fix_rc=${PIPESTATUS[0]}
          set -e
          echo "Pinned upstream HEAD: $actual_sha; bug_rc=$bug_rc; fix_rc=$fix_rc"
          if [[ "$bug_rc" == 0 && "$fix_rc" == 1 ]]; then
            echo "SOURCE_PINNED_OUTCOME=BUG_REPRODUCED"
          elif [[ "$bug_rc" == 1 && "$fix_rc" == 0 ]]; then
            echo "SOURCE_PINNED_OUTCOME=ALREADY_FIXED"
          else
            echo "SOURCE_PINNED_OUTCOME=UNCLASSIFIED; requires independent inspection" >&2
            exit 1
          fi

      - name: Falsification baseline for alternate parents and recursion
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .qualification-venv/bin/python tests/pydantic/14230/extended_cases.py | tee /tmp/pydantic-14230-extended-baseline.json
          baseline_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$baseline_rc" != 1 ]]; then
            echo "EXPECTED_EXTENDED_RED_NOT_FOUND; inspect source before attributing defect" >&2
            exit 1
          fi
          echo "EXTENDED_SOURCE_BASELINE_RED_CONFIRMED"
          .qualification-venv/bin/python tests/pydantic/14230/stress_cases.py --expect-bug
          echo "ADDITIONAL_SOURCE_FALSIFIERS_RED_CONFIRMED"

      - name: Verify native upstream regression test patch fails on unmodified source
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-pydantic apply --check ../tests/pydantic/14230/upstream_regression.patch
          git -C upstream-pydantic apply ../tests/pydantic/14230/upstream_regression.patch
          set +e
          .qualification-venv/bin/python -m pytest -q upstream-pydantic/tests/test_types_typeddict.py -k 'test_typeddict_inherited_config_shared_child' --tb=line
          native_red_rc=$?
          set -e
          if [[ "$native_red_rc" != 1 ]]; then
            echo "UPSTREAM_NATIVE_REGRESSION_RED_MISSING=$native_red_rc" >&2
            exit 1
          fi
          echo "UPSTREAM_NATIVE_REGRESSION_RED_CONFIRMED"
      - name: Record complete native regression baseline on unmodified production source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .qualification-venv/bin/python -m pytest -q upstream-pydantic/tests/test_types_typeddict.py upstream-pydantic/tests/test_type_adapter.py upstream-pydantic/tests/test_config.py upstream-pydantic/tests/test_json_schema.py upstream-pydantic/tests/test_schema_gather.py upstream-pydantic/tests/test_dataclasses.py --tb=line --junitxml=/tmp/typed-baseline.xml
          baseline_rc=$?
          set -e
          if [[ "$baseline_rc" != 0 && "$baseline_rc" != 1 ]]; then
            echo "UPSTREAM_NATIVE_BASELINE_SETUP_FAILURE=$baseline_rc" >&2
            exit "$baseline_rc"
          fi
          echo "UPSTREAM_NATIVE_BASELINE_EXIT=$baseline_rc"

      - name: Apply isolated candidate patch and test for expected GREEN
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-pydantic apply --check ../tests/pydantic/14230/candidate.patch
          git -C upstream-pydantic apply ../tests/pydantic/14230/candidate.patch
          .qualification-venv/bin/python -m compileall -q upstream-pydantic/pydantic/_internal/_generate_schema.py
          set +e
          .qualification-venv/bin/python tests/pydantic/14230/reproducer.py --require-fix | tee /tmp/pydantic-14230-patched.json
          fixed_rc=${PIPESTATUS[0]}
          .qualification-venv/bin/python tests/pydantic/14230/reproducer.py --expect-bug | tee /tmp/pydantic-14230-patch-reverse.json
          bug_rc=${PIPESTATUS[0]}
          set -e
          echo "CANDIDATE_AFTER_PATCH required-fix=$fixed_rc known-bug=$bug_rc"
          if [[ "$fixed_rc" != 0 || "$bug_rc" != 1 ]]; then
            echo "CANDIDATE_PATCH_NOT_QUALIFIED" >&2
            exit 1
          fi
          echo "CANDIDATE_PATCH_TARGETED_GREEN=PASS"
          .qualification-venv/bin/python tests/pydantic/14230/extended_cases.py
          echo "CANDIDATE_ADVERSARIAL_CASES_GREEN=PASS"
          .qualification-venv/bin/python tests/pydantic/14230/stress_cases.py --require-fix
          echo "ADDITIONAL_CANDIDATE_FALSIFIERS_GREEN=PASS"
          .qualification-venv/bin/ruff check upstream-pydantic/pydantic/_internal/_generate_schema.py --output-format concise
          .qualification-venv/bin/ruff format --check upstream-pydantic/pydantic/_internal/_generate_schema.py
          echo "CANDIDATE_RUFF_CHECK_AND_FORMAT=PASS"
          .qualification-venv/bin/python -m pytest -q upstream-pydantic/tests/test_types_typeddict.py -k 'test_typeddict_inherited_config_shared_child' --tb=line
          .qualification-venv/bin/ruff check upstream-pydantic/tests/test_types_typeddict.py --output-format concise
          .qualification-venv/bin/ruff format --check upstream-pydantic/tests/test_types_typeddict.py
          echo "NATIVE_UPSTREAM_REGRESSION_TESTS_GREEN=PASS"
          set +e
          .qualification-venv/bin/python -m pytest -q upstream-pydantic/tests/test_types_typeddict.py upstream-pydantic/tests/test_type_adapter.py upstream-pydantic/tests/test_config.py upstream-pydantic/tests/test_json_schema.py upstream-pydantic/tests/test_schema_gather.py upstream-pydantic/tests/test_dataclasses.py --tb=line --junitxml=/tmp/typed-patched.xml
          patched_rc=$?
          set -e
          if [[ "$patched_rc" != 0 && "$patched_rc" != 1 ]]; then
            echo "UPSTREAM_NATIVE_PATCHED_SETUP_FAILURE=$patched_rc" >&2
            exit "$patched_rc"
          fi
          .qualification-venv/bin/python tests/pydantic/14230/compare_native.py /tmp/typed-baseline.xml /tmp/typed-patched.xml
          echo "UPSTREAM_TYPEDDICT_SUITE_NO_NEW_REGRESSIONS=PASS; existing baseline failures are not suppressed"
