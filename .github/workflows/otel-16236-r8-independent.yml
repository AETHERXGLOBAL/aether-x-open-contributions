name: OTel 16236 R8 independent test architect adversarial requalification

on:
  push:
    branches:
      - evidence/otel-queue-recovery-16236-r1-20261113
    paths:
      - .github/workflows/otel-16236-r8-independent.yml
      - tests/opentelemetry/16236/r8/independent/axg_ta_r8_independent_test.go

permissions:
  contents: read

jobs:
  r8-independent-real-contrib:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Freeze actual sources and verify historic hashes
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/tests/opentelemetry/16236/r8_ta_evidence"
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_SHA" > "$out/independent_execution_head.txt"
          go version > "$out/go_version.txt"
          git init -q /tmp/otel-ta-r8
          git -C /tmp/otel-ta-r8 remote add origin https://github.com/open-telemetry/opentelemetry-collector.git
          git -C /tmp/otel-ta-r8 fetch --depth 1 origin 572057cde7e9bbe3aed6e5e3e8f16290d487f7d0
          git -C /tmp/otel-ta-r8 checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/otel-ta-r8 rev-parse HEAD)" = "572057cde7e9bbe3aed6e5e3e8f16290d487f7d0"
          printf '%s\n' '572057cde7e9bbe3aed6e5e3e8f16290d487f7d0' > "$out/upstream_head.txt"
          q=/tmp/otel-ta-r8/exporter/exporterhelper/internal/queue
          test "$(sha256sum "$q/persistent_queue.go" | cut -d' ' -f1)" = c43eb30c537d6f11a04d23e2502ddf43f6aacb10a0c4b39a2da2069363339bc4
          src=tests/opentelemetry/16236/r2/persistent_queue_candidate.go
          r6=tests/opentelemetry/16236/r6/axg_ta_r6_independent_requalification_test.go
          r7=tests/opentelemetry/16236/r7/independent/axg_ta_r7_independent_test.go
          r8=tests/opentelemetry/16236/r8/axg_metadata_presence_test.go
          test "$(sha256sum "$src" | cut -d' ' -f1)" = 200cb460efa44879827f9074edb911276a3ff1f7ca2f51a4d44c2f5ba844506c
          test "$(sha256sum "$r6" | cut -d' ' -f1)" = e1ff29373e36588e283cda892a7ae8515e9d653775c4692905859a60d35891b7
          test "$(sha256sum "$r7" | cut -d' ' -f1)" = e994907ab702f68415e113b7dc948595f7a9a61437da85cec867439956a9dfd5
          test "$(sha256sum "$r8" | cut -d' ' -f1)" = 8431c66f8d8745e7e13a134151f7542619c735762b91924eecbb98aed7ce28cf
          sha256sum "$src" "$r6" "$r7" "$r8" tests/opentelemetry/16236/r8/independent/axg_ta_r8_independent_test.go > "$out/source_hashes.sha256"
          cp "$src" "$q/persistent_queue.go"
          for f in \
            tests/opentelemetry/16236/axg_recovery_contract_test.go \
            tests/opentelemetry/16236/r2/axg_recovery_r2_test.go \
            tests/opentelemetry/16236/r3/axg_bbolt_sigkill_linux_test.go \
            tests/opentelemetry/16236/r4/axg_independent_bbolt_linux_test.go \
            tests/opentelemetry/16236/r5/axg_qmv0_integrity_test.go \
            tests/opentelemetry/16236/r5/axg_actual_filestorage_test.go \
            tests/opentelemetry/16236/r6/axg_real_filestorage_reliability_test.go
          do cp "$f" "$q/$(basename "$f")"; done
          gofmt -w "$q"/axg*test.go
      - name: Resolve real Contrib file_storage and bbolt dependencies
        shell: bash
        run: |
          set -euo pipefail
          out=tests/opentelemetry/16236/r8_ta_evidence
          go -C /tmp/otel-ta-r8/exporter/exporterhelper get github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage@v0.165.0 > "$out/module_get.log" 2>&1
          go -C /tmp/otel-ta-r8/exporter/exporterhelper list -m github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage > "$out/contrib_version.txt"
          go -C /tmp/otel-ta-r8/exporter/exporterhelper list -m go.etcd.io/bbolt > "$out/bbolt_version.txt"
          grep -qx 'github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.165.0' "$out/contrib_version.txt"
          grep -qx 'go.etcd.io/bbolt v1.5.0' "$out/bbolt_version.txt"
      - name: Original unmodified upstream queue tests, record known failures
        shell: bash
        run: |
          set +e
          out=tests/opentelemetry/16236/r8_ta_evidence
          timeout 450s go -C /tmp/otel-ta-r8/exporter/exporterhelper test -count=1 -v -timeout=7m ./internal/queue > "$out/full_original.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$out/full_original.exit"
          cat "$out/full_original.log"
          exit 0
      - name: Execute historical R5 R6 real file_storage and crash regressions
        shell: bash
        run: |
          set +e
          out=tests/opentelemetry/16236/r8_ta_evidence
          timeout 420s go -C /tmp/otel-ta-r8/exporter/exporterhelper test -count=1 -v -timeout=6m -run '^TestAXGR(3|4|5|6)' ./internal/queue > "$out/historical_r3_r6.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$out/historical_r3_r6.exit"
          cat "$out/historical_r3_r6.log"
          exit 0
      - name: Install untouched R6 R7 TA and R7 R8 engineering tests and independent R8
        shell: bash
        run: |
          set -euo pipefail
          q=/tmp/otel-ta-r8/exporter/exporterhelper/internal/queue
          cp tests/opentelemetry/16236/r6/axg_ta_r6_independent_requalification_test.go "$q/"
          cp tests/opentelemetry/16236/r7/independent/axg_ta_r7_independent_test.go "$q/"
          cp tests/opentelemetry/16236/r7/axg_legacy_fail_closed_test.go "$q/"
          cp tests/opentelemetry/16236/r8/axg_metadata_presence_test.go "$q/"
          cp tests/opentelemetry/16236/r8/independent/axg_ta_r8_independent_test.go "$q/"
          gofmt -w "$q"/axg*test.go
      - name: Independently replay unchanged R6 R7 and engineering R8 regressions
        shell: bash
        run: |
          set +e
          out=tests/opentelemetry/16236/r8_ta_evidence
          timeout 420s go -C /tmp/otel-ta-r8/exporter/exporterhelper test -count=1 -v -timeout=6m -run '^(TestAXGTAR6|TestAXGTAR7|TestAXGR7|TestAXGR8)' ./internal/queue > "$out/unchanged_regressions.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$out/unchanged_regressions.exit"
          cat "$out/unchanged_regressions.log"
          exit 0
      - name: Run independent R8 adversarial and clean controls, retain RED
        shell: bash
        run: |
          set +e
          out=tests/opentelemetry/16236/r8_ta_evidence
          timeout 420s go -C /tmp/otel-ta-r8/exporter/exporterhelper test -count=1 -v -timeout=6m -run '^TestAXGTAR8' ./internal/queue > "$out/independent_r8.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$out/independent_r8.exit"
          cat "$out/independent_r8.log"
          exit 0
      - name: Classify real results without rewriting upstream contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=tests/opentelemetry/16236/r8_ta_evidence
          mkdir -p "$out"
          export OUT="$out"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ['OUT'])
          def s(name):
              f=p/name
              return f.read_text(errors='replace').strip() if f.exists() else 'NOT_RUN'
          def failures(name):
              v=s(name)
              return [x.strip() for x in re.findall(r'(?m)^\s*--- FAIL:\s+([^\n(]+)', v)]
          d={
              'mission':'AXG-OTEL-16236-R8-INDEPENDENT-METADATA-REQUALIFICATION-20261114',
              'execution_head':s('independent_execution_head.txt'),
              'upstream_head':s('upstream_head.txt'),
              'go_version':s('go_version.txt'),
              'contrib_version':s('contrib_version.txt'),
              'bbolt_version':s('bbolt_version.txt'),
              'full_original_exit':s('full_original.exit'),
              'full_original_failures':failures('full_original.log'),
              'historical_r3_r6_exit':s('historical_r3_r6.exit'),
              'historical_r3_r6_failures':failures('historical_r3_r6.log'),
              'unchanged_regressions_exit':s('unchanged_regressions.exit'),
              'unchanged_regressions_failures':failures('unchanged_regressions.log'),
              'independent_r8_exit':s('independent_r8.exit'),
              'independent_r8_failures':failures('independent_r8.log'),
              'upstream_maintainer_contract_approved':False,
              'external_publication_authorized':False,
          }
          known={'TestPersistentQueue_CorruptedData','TestPersistentQueue_CorruptedData/corrupted_metadata','TestPersistentQueue_CorruptedData/corrupted_everything'}
          d['original_contract_conflict_preserved']=(d['full_original_exit']=='1' and set(d['full_original_failures'])==known)
          d['verdict']='REVISE' if (d['independent_r8_exit']!='0' or d['unchanged_regressions_exit']!='0' or d['historical_r3_r6_exit']!='0' or d['full_original_exit']!='0') else 'PASS_SCOPED'
          if 'NOT_RUN' in (d['full_original_exit'],d['independent_r8_exit'],d['unchanged_regressions_exit'],d['historical_r3_r6_exit']): d['verdict']='BLOCKED'
          (p/'result.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps(d,sort_keys=True))
          PY
      - name: Hash complete raw source and test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd tests/opentelemetry/16236/r8_ta_evidence
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload independently executed raw Go logs and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axg-otel-16236-r8-test-architect-independent
          path: tests/opentelemetry/16236/r8_ta_evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Reject failing independent gate and unchanged upstream contract
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tests/opentelemetry/16236/r8_ta_evidence/result.json')
          if not p.is_file(): raise SystemExit("BLOCKED: evidence result missing")
          x=json.loads(p.read_text())
          print("INDEPENDENT_R8_VERDICT="+x['verdict'])
          if x['verdict']!='PASS_SCOPED':
              raise SystemExit("R8 independent/original-suite gate remains non-green; preserve failures")
          PY
