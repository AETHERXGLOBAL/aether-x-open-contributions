name: OTel 16236 R6 real file_storage reliability and fault injection
on:
  push:
    branches:
      - evidence/otel-queue-recovery-16236-r1-20261113
    paths:
      - tests/opentelemetry/16236/r6/axg_real_filestorage_reliability_test.go
      - .github/workflows/otel-16236-r6.yml
      - tests/opentelemetry/16236/r2/persistent_queue_candidate.go
permissions:
  contents: read
jobs:
  actual-contrib-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin exact upstream Go source and internal R5 candidate
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/tests/opentelemetry/16236/r6_reliability_evidence"
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_SHA" > "$out/internal_head.txt"
          git init -q /tmp/otel-r5-ext
          git -C /tmp/otel-r5-ext remote add origin https://github.com/open-telemetry/opentelemetry-collector.git
          git -C /tmp/otel-r5-ext fetch --depth 1 origin 572057cde7e9bbe3aed6e5e3e8f16290d487f7d0
          git -C /tmp/otel-r5-ext checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/otel-r5-ext rev-parse HEAD)" = '572057cde7e9bbe3aed6e5e3e8f16290d487f7d0'
          git -C /tmp/otel-r5-ext rev-parse HEAD > "$out/upstream_head.txt"
          q=/tmp/otel-r5-ext/exporter/exporterhelper/internal/queue
          test "$(sha256sum "$q/persistent_queue.go" | cut -d' ' -f1)" = c43eb30c537d6f11a04d23e2502ddf43f6aacb10a0c4b39a2da2069363339bc4
          cp tests/opentelemetry/16236/r2/persistent_queue_candidate.go "$q/persistent_queue.go"
          cp tests/opentelemetry/16236/axg_recovery_contract_test.go "$q/axg_recovery_contract_test.go"
          cp tests/opentelemetry/16236/r2/axg_recovery_r2_test.go "$q/axg_recovery_r2_test.go"
          cp tests/opentelemetry/16236/r3/axg_bbolt_sigkill_linux_test.go "$q/axg_bbolt_sigkill_linux_test.go"
          cp tests/opentelemetry/16236/r4/axg_independent_bbolt_linux_test.go "$q/axg_independent_bbolt_linux_test.go"
          cp tests/opentelemetry/16236/r5/axg_qmv0_integrity_test.go "$q/axg_qmv0_integrity_test.go"
          cp tests/opentelemetry/16236/r5/axg_actual_filestorage_test.go "$q/axg_actual_filestorage_test.go"
          cp tests/opentelemetry/16236/r6/axg_real_filestorage_reliability_test.go "$q/axg_real_filestorage_reliability_test.go"
          gofmt -w "$q/"axg*test.go
          sha256sum tests/opentelemetry/16236/r2/persistent_queue_candidate.go > "$out/candidate_sha256.txt"
          sha256sum tests/opentelemetry/16236/r6/axg_real_filestorage_reliability_test.go > "$out/r6_test_sha256.txt"
          test "$(sha256sum tests/opentelemetry/16236/r2/persistent_queue_candidate.go | awk '{print $1}')" = '52e5bc04cbc9cb46f1fe4e3e432a19bacb47c5ff0d44232ac337f557e33e6446'
      - name: Install pinned Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install exact release Contrib filestorage v0.165.0 in isolated module
        run: |
          set -euo pipefail
          out=tests/opentelemetry/16236/r6_reliability_evidence
          go version > "$out/go_version.txt"
          go -C /tmp/otel-r5-ext/exporter/exporterhelper get github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage@v0.165.0 > "$out/contrib_get.log" 2>&1
          go -C /tmp/otel-r5-ext/exporter/exporterhelper list -m github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage | tee "$out/contrib_version.txt"
          grep -qx 'github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.165.0' "$out/contrib_version.txt"
          go -C /tmp/otel-r5-ext/exporter/exporterhelper list -m go.etcd.io/bbolt > "$out/bbolt_version.txt"
          go -C /tmp/otel-r5-ext/exporter/exporterhelper list -m all > "$out/resolved_module_versions.txt"
      - name: Execute actual extension lifecycle and recovery tests
        run: |
          set -uo pipefail
          out=tests/opentelemetry/16236/r6_reliability_evidence
          set +e
          timeout 410s go -C /tmp/otel-r5-ext/exporter/exporterhelper test -count=1 -v -timeout=6m -run '^TestAXGR(5|6)' ./internal/queue > "$out/r6_focused.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/r6_focused_exit.txt"
          tail -100 "$out/r6_focused.log"
      - name: Run original upstream Go package without hiding incompatible tests
        run: |
          set -uo pipefail
          out=tests/opentelemetry/16236/r6_reliability_evidence
          set +e
          timeout 450s go -C /tmp/otel-r5-ext/exporter/exporterhelper test -count=1 -timeout=7m ./internal/queue > "$out/full_package.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/full_package_exit.txt"
          tail -65 "$out/full_package.log"
      - name: Classify R6 bounded results and original upstream suite failures
        if: always()
        run: |
          set -euo pipefail
          cd tests/opentelemetry/16236/r6_reliability_evidence
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          def v(n):
              p=Path(n)
              return p.read_text(errors='replace').strip() if p.exists() else ''
          f=v('r6_focused.log')
          p=v('full_package.log')
          names=[s.strip() for s in re.findall(r'(?m)^\s*--- FAIL: ([^\n(]+)',p)]
          allowed={
            'TestPersistentQueue_CorruptedData',
            'TestPersistentQueue_CorruptedData/corrupted_metadata',
            'TestPersistentQueue_CorruptedData/corrupted_everything'
          }
          checks={
            'injected_precommit_full':'AXG_R6_CONTRIB_PRECOMMIT_FULL_FAIL_CLOSED_PRESERVED' in f,
            'postcommit_ambiguous_error':'AXG_R6_CONTRIB_POSTCOMMIT_AMBIGUOUS_REOPEN_PRESERVED' in f,
            'acknowledged_vs_unacknowledged':f.count('AXG_R6_ACK_BOUNDARY_OK')==2,
            'full_capacity':'AXG_R6_FULL_CAPACITY_RESTART_PRESERVED_AND_REJECTED_NEW_OFFER' in f,
            'actual_extension_sigkill_recovery':f.count('AXG_R6_REAL_CONTRIB_SIGKILL_RECOVERED')==2,
            'actual_sigkill_receipts':f.count('AXG_R6_ACTUAL_CONTRIB_PROCESS_SIGKILL_CONFIRMED')==2,
            'r5_contrib_qmv0':'AXG_R5_REAL_FILESTORAGE_QMV0_RESTART_PASS' in f,
            'r5_contrib_legacy':'AXG_R5_REAL_FILESTORAGE_LEGACY_PASS' in f,
            'r5_contrib_corrupt':'AXG_R5_REAL_FILESTORAGE_CORRUPT_QMV0_FAIL_CLOSED' in f,
            'r5_corruption_preservation':'AXG_R5_CORRUPT_QMV0_FAIL_CLOSED_PRESERVED' in f
          }
          res={
             'mission':'AXG-OTEL-16236-R6-RELIABILITY-20261114',
             'tested_head':v('internal_head.txt'),
             'upstream_head':v('upstream_head.txt'),
             'candidate_source_sha256':v('candidate_sha256.txt').split(' ')[0],
             'contrib_module':v('contrib_version.txt'),
             'bbolt_module':v('bbolt_version.txt'),
             'focused_exit':v('r6_focused_exit.txt'),
             'full_package_exit':v('full_package_exit.txt'),
             'full_package_failures':names,
             'checks':checks,
             'real_ENOSPC_tested':False,
             'power_loss_tested':False,
             'exactly_once_delivery_tested':False,
             'independent_test_architect_signoff':False
          }
          res['verdict']='R6_RELIABILITY_PASS_SCOPED_WITH_UPSTREAM_COMPATIBILITY_BLOCK' if (
             res['upstream_head']=='572057cde7e9bbe3aed6e5e3e8f16290d487f7d0' and
             res['candidate_source_sha256']=='52e5bc04cbc9cb46f1fe4e3e432a19bacb47c5ff0d44232ac337f557e33e6446' and
             res['contrib_module'].endswith(' v0.165.0') and
             res['focused_exit']=='0' and all(checks.values()) and
             res['full_package_exit']=='1' and set(names)==allowed and len(names)==len(allowed)
          ) else 'R6_RELIABILITY_REVISE'
          Path('result.json').write_text(json.dumps(res,sort_keys=True,indent=2)+'\n')
          print(json.dumps(res,sort_keys=True))
          PY
      - name: Seal actual raw evidence with SHA-256
        if: always()
        run: |
          set -euo pipefail
          cd tests/opentelemetry/16236/r6_reliability_evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files=sorted(f for f in Path('.').iterdir() if f.is_file() and f.name!='SHA256SUMS.txt')
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in files))
          PY
      - name: Archive exact test logs and failed builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axg-otel-16236-r6-actual-contrib-reliability
          path: tests/opentelemetry/16236/r6_reliability_evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce scoped proof with explicit original compatibility failures
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tests/opentelemetry/16236/r6_reliability_evidence/result.json')
          if not p.exists() or json.loads(p.read_text()).get('verdict')!='R6_RELIABILITY_PASS_SCOPED_WITH_UPSTREAM_COMPATIBILITY_BLOCK':
              raise SystemExit('R6_RELIABILITY_REVISE: inspect original raw logs; no merge or publication')
          print('R6_RELIABILITY_PASS_SCOPED_WITH_UPSTREAM_COMPATIBILITY_BLOCK — original upstream package remains FAIL')
          PY
